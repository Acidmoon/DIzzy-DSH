# Dizzy-DSH 插件合集(patch 挂载层)
#
# 本文件由 dsh plugin add 安装后自动挂载:
#   dsh plugin --profile web add file:<本仓库路径>
#
# 格式:与 dsh-base/cordis.patch.yml 一致 —— 顶层是一个 insert 条目,
# 下面的每一项都是要挂载的插件行(entry)。
#
# 注意:entry 的 name 必须是【包名】,而不是插件文件路径:
#   - Host 半区:loader 按包名 import 包的 main(index.js)挂载插件
#   - Client 半区:client-modules 按包名扫描 dsh.client 声明 + exports["./client"],
#     自动把 client bundle 注入浏览器
# 自有子包(plugins/*)经主包 dependencies 的 file: 依赖安装并提升到
# profile 顶层 node_modules,loader 按包名即可 import。
#
# 新增插件:在 plugins/ 下建子包(自己的 package.json/main/client bundle),
# 主包 package.json 加 file: 依赖,再在本文件加一行 entry。

- insert:
    # ── 自有插件(子包,随主包 file: 依赖安装)────────────────────
    # 余额/额度:Host 刷新 DeepSeek 人民币 + Grok 周额度;
    #       /dizzy/balance + /dizzy/grok-quota;Client 同一输入栏徽章。
    - id: balance
      name: 'dizzy-dsh-balance'

    # 本月用量视图:Host 聚合本地会话日志 + /dizzy/usage;
    #       Client: conversation.view「用量」Tab(对话/轨迹右侧)。
    - id: usage-card
      name: 'dizzy-dsh-usage-card'

    # Agent 规则注入:systemPrompt.section(order -50)读本子包
    #       prompts/agent-instructions.md。
    # 不可用 id: agent-instructions —— 那是 dsh-base 里
    # @deepseek-ai/dsh-agent-instructions 的官方 entry;web-app 虽把它
    # disabled,id 仍占着,再 insert 同 id 会在 boot 抛
    # "duplicate loader entry id: agent-instructions"。
    - id: dizzy-agent-instructions
      name: 'dizzy-dsh-agent-instructions'

    # Kimi WebBridge 浏览器控制:控制用户真实浏览器(daemon 127.0.0.1:10086 +
    # 浏览器扩展)。渐进式披露:全局仅暴露 kimi_browser_activate 引导工具,
    # 模型调用后才注入全套 kimi_browser_* 工具(渐进式披露)。
    - id: kimi-webbridge
      name: 'dizzy-dsh-kimi-webbridge'

    # ── 唯一收录的第三方插件(随主包依赖安装,见 package.json)────────
    # 说明:本包通过主包 dependencies(file:./third-party/...)随主包安装,
    # profile 的 pnpm-workspace.yaml 为 hoisted 模式,传递依赖提升到顶层
    # node_modules,loader 按包名即可 import。无需单独 dsh plugin add。
    #
    # 除它之外,本合集 2026-09 起不再收录第三方插件:曾收录的
    # dsh-better-sidebar / dsh-vision-toolkit / dsh-genui / dsh-notification /
    # dsh-subscription-auth / dsh-gui-customization 已连同快照与本地补丁删除
    # (快照跟随上游漂移,上游改 peer 范围就会让合集装不上,排查成本落在这里)。
    #
    # TencentDB Agent Memory 个人记忆插件(适配层 + 内置 MemoryCore/MemoryKnowledge)。
    # 上游:https://github.com/TencentCloud/TencentDB-Agent-Memory
    # 能力:L0-L3 记忆工具 + Wiki/CodeGraph 工具 + 自动捕获/召回/画像
    #       + conversation.view「记忆」页 + Memory/Knowledge sidecar 托管。
    # sidecar 默认跑包内 engines/;gatewayDir/knowledgeDir 留空即换机即用。
    - id: memory-tencentdb
      name: 'dsh-plugin-memory-tencentdb'
      config:
        server:
          url: http://127.0.0.1:8420
          apiKey: local
          credentialName: ''
          instanceId: default
          teamId: personal
          agentId: personal-agent
          userId: personal-user
          autoIdentity: true
          timeoutMs: 30000
          rejectUnauthorized: true
        recall:
          enabled: true
          autoInject: true
          maxResults: 5
          refreshIntervalMs: 60000
        capture:
          enabled: true
          onlyUserSource: true
          flushIntervalMs: 2000
          skipFailedTurns: true
        knowledge:
          enabled: true
          url: http://127.0.0.1:8421
          serviceId: default
          timeoutMs: 30000
        runtime:
          manageSidecars: true
          gatewayPort: 8420
          knowledgePort: 8421
          llmBaseUrl: https://api.deepseek.com/v1
          llmModel: deepseek-chat
          llmMaxTokens: 8192
