# Dizzy-DSH 插件层(bundle patch)
#
# 本文件由 dsh plugin add 安装后自动挂载:
#   dsh plugin --profile web add link:<本仓库路径>
#
# 格式:与 dsh-base/cordis.patch.yml 一致 —— 顶层是一个 insert 条目,
# 下面的每一项都是要挂载的插件行。
#
# 注意:entry 的 name 必须是【包名】,而不是插件文件路径:
#   - Host 半区:loader 按包名 import 包的 main(index.js)挂载插件
#   - Client 半区:client-modules 按包名扫描 dsh.client 声明 + exports["./client"],
#     自动把 client.js 注入浏览器
# 这与 profile 里已有的 @dsh-external/dsh-vision-toolkit 完全同构。

- insert:
    # ── 余额类 ────────────────────────────────────────────────────────────
    # DeepSeek 账户余额查询 + 输入栏余额徽章(模型选择器左侧)。
    # Host: 每分钟刷新余额,提供 GET /dizzy/balance 与 balance_check 工具;
    # Client: conversation.input.right 徽章,仅 deepseek-official 模型显示。
    - id: dizzy-dsh
      name: 'dizzy-dsh'

    # ── 新插件模板(复制此块,改 id/name)────────────────────────────────
    # - id: kit-my-feature
    #   name: 'dizzy-dsh'
    #   disabled: true
    #   说明:新功能直接加进 index.js(或拆成子模块 import),client 半区在 client.js 扩展。
