# Dizzy-DSH 插件层(bundle patch)
#
# 本文件由 dsh plugin add 安装后自动挂载:
#   dsh plugin --profile web add link:<本仓库路径>
#
# 格式:与 dsh-base/cordis.patch.yml 一致 —— 顶层是一个 insert 条目,
# 下面的每一项都是要挂载的插件行。loader 以 profile 为基准解析 name,
# 包内插件通过包名子路径引用(见下方 name 写法)。
#
# 平面规则:
#   - 这里是 HOST 组合层:注册的工具对所有会话可见,跨会话共享
#   - 需要"每会话独立"的配置(如 persona、每会话工具),放 agent preset
#   - 浏览器 UI 插件需要 npm 包 + dsh.client 声明,本层只做 Host 端

- insert:
    # ── 余额类 ────────────────────────────────────────────────────────────
    # DeepSeek 账户余额查询:每分钟刷新,注册模型可见工具 balance_check。
    # 完整 Node 环境,直接 fetch;API Key 走 credentials(DEEPSEEK_API_KEY)。
    - id: kit-balance
      name: 'dizzy-dsh/plugins/balance.js'

    # ── 新插件模板(复制此块,改 id/name)────────────────────────────────
    # - id: kit-my-feature
    #   name: 'dizzy-dsh/plugins/my-feature.js'
    #   disabled: true
